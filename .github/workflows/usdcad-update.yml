name: Update USDCAD fair value

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usdcad-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: USDCAD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: USDCAD/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - name: Fetch and recalculate (retain degraded/failure status)
        id: calculate
        continue-on-error: true
        run: python -m backend.update
      - name: Validate model and static bundle
        run: npm test && npm run build
      - name: Save calculated snapshot and update health
        run: |
          git config user.name "fair-value-bot"
          git config user.email "fair-value-bot@users.noreply.github.com"
          git add data/observations.csv data/dashboard.json data/update-status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update USDCAD fair value"
            git push
          fi
      - name: Surface partial or failed source update
        if: steps.calculate.outcome == 'failure'
        run: |
          echo "Update was partial or failed. Last valid valuation and health status were saved."
          exit 1
