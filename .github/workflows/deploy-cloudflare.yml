name: Deploy fair-value dashboard to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'USDCAD/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
  # GITHUB_TOKEN-created data commits do not emit ordinary push workflow events.
  workflow_run:
    workflows: ['Update USDCAD fair value']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-fair-value
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build static dashboard and latest calculated JSON
        working-directory: USDCAD
        env:
          USDCAD_API_URL: ''
        run: npm run build
      - name: Verify Cloudflare access and prepare Pages project
        id: cloudflare
        working-directory: USDCAD
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare.mjs prepare
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN }}
          accountId: ${{ steps.cloudflare.outputs.account_id }}
          wranglerVersion: '4'
          workingDirectory: USDCAD
          command: pages deploy dist --project-name=${{ steps.cloudflare.outputs.project_name }} --branch=main
      - name: Bind fv.podor.org and verify HTTPS publication
        working-directory: USDCAD
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: node scripts/cloudflare.mjs bind
      - name: Verify dashboard and data through the custom domain
        working-directory: USDCAD
        env:
          USDCAD_FRONTEND_URL: https://fv.podor.org
        run: npm run smoke
